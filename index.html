const makeImage = (o={}) => ({ id:crypto.randomUUID(), data:"", url:"", ...o });
const makeSubScene = (o={}) => ({ id:crypto.randomUUID(), title:"SUB-SCENE", narration:"", description:"", prompts:"", notes:"", images:[], ...o });

const makeResource = (o={}) => ({ id:crypto.randomUUID(), label:"", url:"", context:"", ...o });

function resizeAndEncode(file, maxW=1200, q=0.82) {
  return new Promise((res,rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW/img.width);
      const c = document.createElement("canvas");
      c.width = img.width*scale; c.height = img.height*scale;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q));
    };
    img.onerror = rej; img.src = url;
  });
}

// ── Export helpers ────────────────────────────────────────────────────────
function exportProjectJSON(project) {
  // strip base64 image data, keep only URLs
  const clean = {
    name: project.name,
    shots: project.shots.map(s => ({
      title: s.title,
      narration: s.narration,
      description: s.description,
      status: s.status,
      prompts: s.prompts,
      notes: s.notes,
      images: (s.images||[]).map(i => ({ url: i.url||"" })),
      subScenes: (s.subScenes||[]).map(ss => ({
        title: ss.title,
        narration: ss.narration,
        description: ss.description,
        prompts: ss.prompts,
        notes: ss.notes,
        images: (ss.images||[]).map(i => ({ url: i.url||"" })),
      }))
    })),
    resources: (project.resources||[]).map(r => ({ label:r.label, url:r.url, context:r.context }))
  };
  const blob = new Blob([JSON.stringify(clean, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${project.name.replace(/[^a-z0-9]/gi,"_")}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function shotToScript(shot, subScenes) {
  const lines = [];
  lines.push(`SHOT: ${shot.title}`);
  lines.push(`STATUS: ${shot.status.toUpperCase()}`);
  if (shot.description) lines.push(`\nSCENE\n${shot.description}`);
  if (shot.narration)   lines.push(`\nNARRATION\n"${shot.narration}"`);
  if (shot.prompts)     lines.push(`\nIMAGE PROMPTS\n${shot.prompts}`);
  if (shot.notes)       lines.push(`\nNOTES\n${shot.notes}`);
  if (subScenes && subScenes.length > 0) {
    lines.push(`\n${"─".repeat(40)}`);
    lines.push(`SUB-SCENES (${subScenes.length})`);
    subScenes.forEach((ss, i) => {
      lines.push(`\n── Sub-scene ${i+1}: ${ss.title}`);
      if (ss.description) lines.push(`SCENE\n${ss.description}`);
      if (ss.narration)   lines.push(`NARRATION\n"${ss.narration}"`);
      if (ss.prompts)     lines.push(`IMAGE PROMPTS\n${ss.prompts}`);
      if (ss.notes)       lines.push(`NOTES\n${ss.notes}`);
      if (ss.images && ss.images.some(i=>i.url)) {
        const urls = ss.images.filter(i=>i.url).map(i=>i.url);
        lines.push(`IMAGE REFS\n${urls.join("\n")}`);
      }
    });
  }
  return lines.join("\n");
}

function parseImport(text) { const raw=JSON.parse(text); return makeProject(raw.name||"Imported", raw.shots||[]); }

// ── Firebase hook ─────────────────────────────────────────────────────────
function useTrackerData() {
  const [data, setData] = useState(null);
  const [saveStatus, setSaveStatus] = useState("saved");
  const timer = useRef(null);
  useEffect(() => {
    const load = async () => {
      try {
        const snap = await window.__getDoc(window.__docRef);
        if (snap.exists()) { setData({...defaultData(),...snap.data().payload}); return; }
      } catch(e) { console.error(e); }
      setData(defaultData());
    };
    if (window.__fbReady) load();
    else window.addEventListener("fb-ready", load, {once:true});
  }, []);
  const save = useCallback((next) => {
    clearTimeout(timer.current); setSaveStatus("saving");
    timer.current = setTimeout(async () => {
      try { await window.__setDoc(window.__docRef, {payload:next}); setSaveStatus("saved"); }
      catch(e) { console.error(e); setSaveStatus("error"); }
    }, 800);
  }, []);
  const update = useCallback((fn) => { setData(prev => { const next=fn(prev); save(next); return next; }); }, [save]);
  return {data, update, saveStatus};
}

// ── Multi-image field ─────────────────────────────────────────────────────
function ImagesField({images, onChange, t}) {
  const imgs = images||[];
  const canAdd = imgs.length < MAX_IMAGES;
  const [lightbox, setLightbox] = useState(null);

  const handleUpload = async (e) => {
    const files = Array.from(e.target.files).slice(0, MAX_IMAGES - imgs.length);
    e.target.value = "";
    const encoded = await Promise.all(files.map(f => resizeAndEncode(f)));
    onChange([...imgs, ...encoded.map(data => makeImage({data}))]);
  };
  const addUrl = () => onChange([...imgs, makeImage()]);
  const updImg = (id, field, val) => onChange(imgs.map(i => i.id===id ? {...i,[field]:val} : i));
  const removeImg = (id) => onChange(imgs.filter(i => i.id!==id));

  return (
    <div>
      {imgs.length > 0 && (
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))", gap:10, marginBottom:12}}>
          {imgs.map((img,i) => {
            const src = img.data||img.url||null;
            return (
              <div key={img.id} style={{position:"relative", border:`1px solid ${t.border}`, borderRadius:4, overflow:"hidden", background:t.bg3}}>
                {src
                  ? <img src={src} onClick={()=>setLightbox(src)} style={{width:"100%",height:110,objectFit:"cover",display:"block",cursor:"zoom-in"}} onError={e=>e.target.style.display="none"}/>
                  : <div style={{padding:"8px 10px"}}><input value={img.url} onChange={e=>updImg(img.id,"url",e.target.value)} placeholder="Paste URL…" style={{...inp(t),fontSize:12,padding:"6px 8px"}}/></div>
                }
                <div style={{display:"flex",justifyContent:"space-between",padding:"4px 6px",background:t.bg3,borderTop:`1px solid ${t.border}`}}>
                  <span style={{fontSize:11,color:t.text4}}>#{i+1}</span>
                  <button onClick={()=>removeImg(img.id)} style={{background:"none",border:"none",color:t.text4,cursor:"pointer",fontSize:14,padding:0,lineHeight:1}}>×</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {canAdd && (
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <label style={{display:"inline-flex",alignItems:"center",gap:8,cursor:"pointer",padding:"8px 14px",border:`1px dashed ${t.border}`,borderRadius:4,background:t.bg3,fontSize:13,color:t.text3}}>
            Upload image{MAX_IMAGES-imgs.length>1?"s":""}
            <input type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleUpload}/>
            <span style={{color:t.accent,fontSize:12}}>Browse</span>
          </label>
          <button onClick={addUrl} style={{padding:"8px 14px",background:"transparent",border:`1px dashed ${t.border}`,borderRadius:4,color:t.text3,cursor:"pointer",fontSize:13}}>+ URL slot</button>
          <span style={{fontSize:12,color:t.text4}}>{imgs.length}/{MAX_IMAGES}</span>
        </div>
      )}
      {!canAdd && <div style={{fontSize:12,color:t.text4,marginTop:4}}>Maximum {MAX_IMAGES} images reached.</div>}
      {lightbox && (
        <div onClick={()=>setLightbox(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,cursor:"zoom-out"}}>
          <img src={lightbox} style={{maxWidth:"90vw",maxHeight:"90vh",objectFit:"contain",borderRadius:4}}/>
        </div>
      )}
    </div>
  );
}

// ── Copy button ───────────────────────────────────────────────────────────
function CopyButton({getText, label, t}) {
  const [state, setState] = useState("idle"); // idle | copied | error
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(getText());
      setState("copied");
      setTimeout(() => setState("idle"), 2000);
    } catch {
      setState("error");
      setTimeout(() => setState("idle"), 2000);
    }
  };
  const color = state==="copied" ? "#2ecc71" : state==="error" ? "#e74c3c" : t.text3;
  const text = state==="copied" ? "✓ Copied!" : state==="error" ? "Failed" : label;
  return (
    <button onClick={copy} style={{background:t.bg3, border:`1px solid ${state==="copied"?"#2ecc71":t.border}`, borderRadius:4, color, cursor:"pointer", fontSize:13, padding:"5px 14px", transition:"all 0.2s", whiteSpace:"nowrap"}}>
      {text}
    </button>
  );
}

// ── Sub-scene panel ───────────────────────────────────────────────────────
function SubScenePanel({shot, subScenes, onUpdate, t}) {
  const [expanded, setExpanded] = useState(null);
  const add = () => { const s=makeSubScene(); onUpdate([...subScenes,s]); setExpanded(s.id); };
  const del = (id) => { onUpdate(subScenes.filter(s=>s.id!==id)); if(expanded===id)setExpanded(null); };
  const upd = (id,field,val) => onUpdate(subScenes.map(s=>s.id===id?{...s,[field]:val}:s));

  return (
    <div style={{marginTop:22, paddingTop:18, borderTop:`2px dashed ${t.border}`}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14, flexWrap:"wrap", gap:8}}>
        <div style={{fontSize:12, letterSpacing:"0.2em", color:t.gold, textTransform:"uppercase"}}>Sub-Scenes ({subScenes.length})</div>
        <div style={{display:"flex", gap:8}}>
          {subScenes.length > 0 && (
            <CopyButton
              getText={() => shotToScript(shot, subScenes)}
              label="📋 Copy all as script"
              t={t}
            />
          )}
          <button onClick={add} style={{background:t.bg3, border:`1px solid ${t.border}`, borderRadius:4, color:t.text3, cursor:"pointer", fontSize:13, padding:"5px 14px"}}>+ Add Sub-Scene</button>
        </div>
      </div>
      {subScenes.length===0 && <div style={{color:t.text4, fontSize:14, fontStyle:"italic", marginBottom:8}}>No sub-scenes yet. Break this shot down further.</div>}
      {subScenes.map((ss,i) => {
        const isOpen = expanded===ss.id;
        const firstImg = (ss.images||[])[0];
        const thumb = firstImg?(firstImg.data||firstImg.url):null;
        return (
          <div key={ss.id} style={{marginBottom:8, border:`1px solid ${t.subBorder}`, borderRadius:5, background:t.subBg}}>
            <div style={{display:"flex", alignItems:"center", padding:"10px 14px", gap:12}}>
              <div onClick={()=>setExpanded(isOpen?null:ss.id)} style={{display:"flex",alignItems:"center",gap:12,flex:1,minWidth:0,cursor:"pointer",userSelect:"none"}}>
                <div style={{minWidth:28,height:28,border:`1px solid ${t.border}`,borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:t.gold,fontFamily:"monospace",flexShrink:0}}>{i+1}</div>
                {thumb && <img src={thumb} style={{width:44,height:28,objectFit:"cover",borderRadius:2,flexShrink:0,border:`1px solid ${t.border}`}} onError={e=>e.target.style.display="none"}/>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,color:t.text2,textTransform:"uppercase",letterSpacing:"0.05em"}}>{ss.title||"UNTITLED SUB-SCENE"}</div>
                  {!isOpen && <div style={{fontSize:12,color:t.text4,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ss.description||"—"}</div>}
                </div>
              </div>
              <CopyButton getText={()=>shotToScript(ss,[])} label="📋 Copy" t={t}/>
              {(ss.images||[]).length>0 && <span style={{fontSize:11,color:t.text4,flexShrink:0}}>{ss.images.length} img{ss.images.length>1?"s":""}</span>}
              <button onClick={()=>del(ss.id)} style={{background:"none",border:`1px solid ${t.border}`,borderRadius:3,color:t.text4,cursor:"pointer",fontSize:16,padding:"3px 9px",flexShrink:0}}>×</button>
              <div onClick={()=>setExpanded(isOpen?null:ss.id)} style={{color:t.text4,fontSize:10,flexShrink:0,transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",cursor:"pointer"}}>▼</div>
            </div>
            {isOpen && (
              <div style={{padding:"0 14px 16px", borderTop:`1px solid ${t.border2}`}}>
                <Field label="Sub-Scene Title" t={t} mt={14}><input value={ss.title} onChange={e=>upd(ss.id,"title",e.target.value)} style={{...inp(t),textTransform:"uppercase",letterSpacing:"0.06em"}}/></Field>
                <Field label="Reference Images" t={t} mt={14}><ImagesField images={ss.images||[]} onChange={v=>upd(ss.id,"images",v)} t={t}/></Field>
                <Field label="Scene Description" t={t} mt={14}><Textarea value={ss.description} onChange={v=>upd(ss.id,"description",v)} placeholder="What happens in this sub-scene…" t={t}/></Field>
                <Field label="Narration / VO" t={t} mt={14}><Textarea value={ss.narration} onChange={v=>upd(ss.id,"narration",v)} placeholder="Voice-over for this moment…" t={t}/></Field>
                <Field label="Image Prompts" t={t} mt={14}><Textarea value={ss.prompts} onChange={v=>upd(ss.id,"prompts",v)} placeholder="Generation prompts…" mono t={t}/></Field>
                <Field label="Notes" t={t} mt={14}><Textarea value={ss.notes} onChange={v=>upd(ss.id,"notes",v)} placeholder="Thoughts, references…" t={t}/></Field>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── Root ──────────────────────────────────────────────────────────────────
function App() {
  const {data,update,saveStatus} = useTrackerData();
  const [showKC,setShowKC] = useState(false);
  if (!data) return <Loading/>;
  const t = data.theme==="light"?LIGHT:DARK;
  const toggleTheme = () => update(d=>({...d,theme:d.theme==="dark"?"light":"dark"}));
  const active = data.projects.find(p=>p.id===data.activeId)??null;
  const ss = document.getElementById("ss")||(()=>{const s=document.createElement("style");s.id="ss";document.head.appendChild(s);return s;})();
  ss.textContent=`::-webkit-scrollbar-track{background:${t.bg}}::-webkit-scrollbar-thumb{background:${t.scrollThumb}}body{background:${t.bg}}`;

  if (showKC) return <KnowledgeCenter entries={data.knowledgeCenter||[]} onBack={()=>setShowKC(false)} onChange={kc=>update(d=>({...d,knowledgeCenter:kc}))} saveStatus={saveStatus} t={t} theme={data.theme} onToggleTheme={toggleTheme}/>;
  if (!active) return <ProjectManager projects={data.projects} saveStatus={saveStatus} t={t} theme={data.theme} onToggleTheme={toggleTheme}
    onOpen={id=>update(d=>({...d,activeId:id}))}
    onCreate={name=>update(d=>{const p=makeProject(name);return{...d,projects:[...d.projects,p],activeId:p.id};})}
    onRename={(id,name)=>update(d=>({...d,projects:d.projects.map(p=>p.id===id?{...p,name}:p)}))}
    onDelete={id=>update(d=>({...d,projects:d.projects.filter(p=>p.id!==id),activeId:d.activeId===id?null:d.activeId}))}
    onImport={proj=>update(d=>({...d,projects:[...d.projects,proj]}))}
    onKC={()=>setShowKC(true)}/>;
  return <ShotEditor project={active} saveStatus={saveStatus} t={t} theme={data.theme} onToggleTheme={toggleTheme}
    onBack={()=>update(d=>({...d,activeId:null}))}
    onUpdateProject={proj=>update(d=>({...d,projects:d.projects.map(p=>p.id===active.id?proj:p)}))}/>;
}

// ── Project Manager ───────────────────────────────────────────────────────
function ProjectManager({projects,saveStatus,t,theme,onToggleTheme,onOpen,onCreate,onRename,onDelete,onImport,onKC}) {
  const [newName,setNewName] = useState("");
  const [renamingId,setRenamingId] = useState(null);
  const [renameVal,setRenameVal] = useState("");
  const [confirmDelete,setConfirmDelete] = useState(null);
  const [importError,setImportError] = useState("");
  const submit = () => { const n=newName.trim(); if(!n)return; onCreate(n); setNewName(""); };
  const handleImport = e => {
    const file=e.target.files[0]; if(!file)return;
    const r=new FileReader();
    r.onload=ev=>{try{onImport(parseImport(ev.target.result));setImportError("");}catch{setImportError("Invalid JSON format.");}};
    r.readAsText(file); e.target.value="";
  };
  return (
    <div style={{minHeight:"100vh",background:t.bg,color:t.text,fontFamily:"Georgia,serif"}}>
      <div style={{maxWidth:760,margin:"0 auto",padding:"48px 32px 80px"}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:48}}>
          <div>
            <div style={{fontSize:13,letterSpacing:"0.25em",color:t.accent,textTransform:"uppercase",marginBottom:6}}>Animation Studio</div>
            <h1 style={{fontSize:32,fontWeight:"normal",color:t.text,marginBottom:6}}>Projects</h1>
            <SaveDot status={saveStatus} t={t}/>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center",marginTop:8}}>
            <ThemeToggle theme={theme} onToggle={onToggleTheme} t={t}/>
            <Btn t={t} muted onClick={onKC}>Knowledge Center</Btn>
          </div>
        </div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="New project name…" style={inp(t)}/>
          <Btn t={t} onClick={submit} disabled={!newName.trim()}>+ Create</Btn>
        </div>
        <div style={{marginBottom:40}}>
          <label style={{display:"inline-flex",alignItems:"center",gap:8,cursor:"pointer"}}>
            <span style={{fontSize:14,padding:"8px 16px",border:`1px solid ${t.border}`,borderRadius:4,background:t.bg3,color:t.text3}}>Import JSON</span>
            <input type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
          </label>
          {importError&&<div style={{fontSize:13,color:"#e74c3c",marginTop:8}}>{importError}</div>}
          <div style={{fontSize:12,color:t.text4,marginTop:10,lineHeight:1.8}}>Expected: <code style={{color:t.text3}}>{`{ "name": "...", "shots": [...], "resources": [] }`}</code></div>
        </div>
        {projects.length===0&&<div style={{color:t.text4,fontSize:16,fontStyle:"italic"}}>No projects yet.</div>}
        {projects.map(p=>{
          const done=p.shots.filter(s=>s.status==="done").length;
          const pct=p.shots.length?Math.round((done/p.shots.length)*100):0;
          return (
            <div key={p.id} style={{display:"flex",alignItems:"center",padding:"20px 22px",border:`1px solid ${t.border}`,borderRadius:6,marginBottom:10,background:t.card,boxShadow:t.shadow,gap:16}}>
              <div style={{flex:1,minWidth:0}}>
                {renamingId===p.id
                  ?<input autoFocus value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter"){onRename(p.id,renameVal.trim()||p.name);setRenamingId(null);}if(e.key==="Escape")setRenamingId(null);}}
                      onBlur={()=>{onRename(p.id,renameVal.trim()||p.name);setRenamingId(null);}}
                      style={{...inp(t),fontSize:17}}/>
                  :<div style={{fontSize:18,color:t.text,cursor:"pointer"}} onClick={()=>onOpen(p.id)}>{p.name}</div>
                }
                <div style={{display:"flex",alignItems:"center",gap:14,marginTop:10}}>
                  <div style={{flex:1,height:4,background:t.bg3,borderRadius:2}}>
                    <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${t.accent},${t.gold})`,borderRadius:2,transition:"width .4s"}}/>
                  </div>
                  <div style={{fontSize:13,color:t.text3,whiteSpace:"nowrap"}}>{done}/{p.shots.length} done</div>
                </div>
              </div>
              <div style={{display:"flex",gap:8,flexShrink:0}}>
                <Btn t={t} small onClick={()=>onOpen(p.id)}>Open</Btn>
                <Btn t={t} small muted onClick={()=>{setRenamingId(p.id);setRenameVal(p.name);}}>Rename</Btn>
                <Btn t={t} small danger onClick={()=>setConfirmDelete(p.id)}>Delete</Btn>
              </div>
            </div>
          );
        })}
      </div>
      {confirmDelete&&<Modal title="Delete project?" body={`"${projects.find(p=>p.id===confirmDelete)?.name}" will be permanently removed.`} onConfirm={()=>{onDelete(confirmDelete);setConfirmDelete(null);}} onCancel={()=>setConfirmDelete(null)} danger t={t}/>}
    </div>
  );
}

// ── Knowledge Center ──────────────────────────────────────────────────────
function KnowledgeCenter({entries,onBack,onChange,saveStatus,t,theme,onToggleTheme}) {
  const add=()=>onChange([...entries,makeResource()]);
  const upd=(id,f,v)=>onChange(entries.map(e=>e.id===id?{...e,[f]:v}:e));
  return (
    <div style={{minHeight:"100vh",background:t.bg,color:t.text,fontFamily:"Georgia,serif"}}>
      <div style={{background:t.card,borderBottom:`1px solid ${t.border}`,padding:"20px 40px",position:"sticky",top:0,zIndex:100,boxShadow:t.shadow}}>
        <div style={{maxWidth:880,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <button onClick={onBack} style={{background:"none",border:"none",color:t.text3,cursor:"pointer",fontSize:15,padding:0,marginBottom:6}}>← All Projects</button>
            <div style={{fontSize:13,letterSpacing:"0.2em",color:t.accent,textTransform:"uppercase"}}>Studio-Wide Reference</div>
            <div style={{fontSize:24,color:t.text,fontWeight:"normal",marginTop:2}}>Knowledge Center</div>
          </div>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <SaveDot status={saveStatus} t={t}/>
            <ThemeToggle theme={theme} onToggle={onToggleTheme} t={t}/>
          </div>
        </div>
      </div>
      <div style={{maxWidth:880,margin:"0 auto",padding:"28px 40px 80px"}}>
        <div style={{fontSize:15,color:t.text3,marginBottom:28,lineHeight:1.8}}>Global reference library — pipeline docs, model specs, how-to guides. Anything studio-wide.</div>
        {entries.length===0&&<div style={{color:t.text4,fontSize:15,fontStyle:"italic",marginBottom:20}}>No entries yet.</div>}
        {entries.map(entry=>(
          <div key={entry.id} style={{marginBottom:10,border:`1px solid ${t.border}`,borderRadius:6,background:t.card,padding:"18px 20px",boxShadow:t.shadow}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
              <Field label="Label" t={t}><input value={entry.label} onChange={e=>upd(entry.id,"label",e.target.value)} placeholder="e.g. Blender Pipeline Guide" style={inp(t)}/></Field>
              <Field label="URL" t={t}><input value={entry.url} onChange={e=>upd(entry.id,"url",e.target.value)} placeholder="https://drive.google.com/…" style={inp(t)}/></Field>
            </div>
            <Field label="Description" t={t}>
              <div style={{display:"flex",gap:10}}>
                <input value={entry.context} onChange={e=>upd(entry.id,"context",e.target.value)} placeholder="What is this? When to use it?" style={{...inp(t),flex:1}}/>
                {entry.url&&<a href={entry.url} target="_blank" rel="noreferrer" style={{padding:"10px 18px",background:t.accent,borderRadius:4,color:"#fff",fontSize:14,whiteSpace:"nowrap"}}>Open →</a>}
                <button onClick={()=>onChange(entries.filter(e=>e.id!==entry.id))} style={{background:"none",border:`1px solid ${t.border}`,borderRadius:4,color:t.text3,cursor:"pointer",fontSize:18,padding:"6px 14px"}}>×</button>
              </div>
            </Field>
          </div>
        ))}
        <div style={{marginTop:20}}><Btn t={t} onClick={add}>+ Add Entry</Btn></div>
      </div>
    </div>
  );
}

// ── Shot Editor ───────────────────────────────────────────────────────────
function ShotEditor({project,saveStatus,t,theme,onToggleTheme,onBack,onUpdateProject}) {
  const [tab,setTab] = useState("shots");
  const [expanded,setExpanded] = useState(null);
  const [filter,setFilter] = useState("all");
  const [dragging,setDragging] = useState(null);
  const [dragOver,setDragOver] = useState(null);
  const [confirmDelete,setConfirmDelete] = useState(null);
  const isDraggingRef = useRef(false);

  const shots = project.shots;
  const resources = project.resources||[];
  const updShots = s => onUpdateProject({...project,shots:s});
  const updResources = r => onUpdateProject({...project,resources:r});
  const upd = (id,field,value) => updShots(shots.map(s=>s.id===id?{...s,[field]:value}:s));
  const addShot = () => { const s=makeShot(); updShots([...shots,s]); setExpanded(s.id); };
  const deleteShot = id => { updShots(shots.filter(s=>s.id!==id)); if(expanded===id)setExpanded(null); setConfirmDelete(null); };

  const onHandleMouseDown = () => { isDraggingRef.current=true; };
  const onDragStart = (e,id) => { if(!isDraggingRef.current){e.preventDefault();return;} setDragging(id); };
  const onDragEnd = () => { setDragging(null); setDragOver(null); isDraggingRef.current=false; };
  const onDrop = targetId => {
    if(!dragging||dragging===targetId)return;
    const arr=[...shots];
    const fi=arr.findIndex(s=>s.id===dragging), ti=arr.findIndex(s=>s.id===targetId);
    const [item]=arr.splice(fi,1); arr.splice(ti,0,item);
    updShots(arr); setDragging(null); setDragOver(null);
  };

  const counts = {pending:shots.filter(s=>s.status==="pending").length,"in-progress":shots.filter(s=>s.status==="in-progress").length,done:shots.filter(s=>s.status==="done").length};
  const progress = shots.length?Math.round((counts.done/shots.length)*100):0;
  const filtered = filter==="all"?shots:shots.filter(s=>s.status===filter);
  const smeta = {pending:t.sP,"in-progress":t.sI,done:t.sD};

  return (
    <div style={{minHeight:"100vh",background:t.bg,color:t.text,fontFamily:"Georgia,serif"}}>
      <div style={{background:t.card,borderBottom:`1px solid ${t.border}`,padding:"20px 40px",position:"sticky",top:0,zIndex:100,boxShadow:t.shadow}}>
        <div style={{maxWidth:940,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
            <div>
              <button onClick={onBack} style={{background:"none",border:"none",color:t.text3,cursor:"pointer",fontSize:15,padding:0,marginBottom:6}}>← All Projects</button>
              <div style={{fontSize:12,letterSpacing:"0.2em",color:t.accent,textTransform:"uppercase"}}>Production Pipeline</div>
              <div style={{fontSize:24,color:t.text,fontWeight:"normal",marginTop:2}}>{project.name}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <ThemeToggle theme={theme} onToggle={onToggleTheme} t={t}/>
                <button onClick={()=>exportProjectJSON(project)} style={{fontSize:13,background:t.bg3,border:`1px solid ${t.border}`,borderRadius:4,color:t.text3,padding:"8px 16px",cursor:"pointer"}}>Export JSON</button>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:30,fontWeight:"bold",color:t.gold}}>{progress}%</div>
                <div>
                  <div style={{fontSize:12,color:t.text4,textTransform:"uppercase",letterSpacing:"0.1em"}}>Complete</div>
                  <SaveDot status={saveStatus} t={t}/>
                </div>
              </div>
            </div>
          </div>
          <div style={{marginTop:14,height:4,background:t.bg3,borderRadius:2}}>
            <div style={{height:"100%",width:`${progress}%`,background:`linear-gradient(90deg,${t.accent},${t.gold})`,borderRadius:2,transition:"width .5s"}}/>
          </div>
          <div style={{display:"flex",gap:0,marginTop:18,borderBottom:`1px solid ${t.border2}`,alignItems:"center"}}>
            {["shots","resources"].map(tb=>(
              <button key={tb} onClick={()=>setTab(tb)} style={{padding:"8px 22px",background:"transparent",border:"none",borderBottom:`3px solid ${tab===tb?t.accent:"transparent"}`,color:tab===tb?t.text:t.text4,fontSize:15,letterSpacing:"0.08em",textTransform:"uppercase",cursor:"pointer",marginBottom:"-1px"}}>
                {tb}
              </button>
            ))}
            {tab==="shots"&&(
              <div style={{display:"flex",gap:6,marginLeft:16,paddingBottom:6}}>
                {[["all",`All ${shots.length}`],["pending",`Pending ${counts.pending}`],["in-progress",`In Progress ${counts["in-progress"]}`],["done",`Done ${counts.done}`]].map(([v,l])=>(
                  <button key={v} onClick={()=>setFilter(v)} style={{padding:"5px 12px",background:filter===v?t.accent:"transparent",border:`1px solid ${filter===v?t.accent:t.border}`,borderRadius:4,color:filter===v?"#fff":t.text4,fontSize:13,cursor:"pointer"}}>{l}</button>
                ))}
              </div>
            )}
            <div style={{flex:1}}/>
            <div style={{paddingBottom:6}}>
              {tab==="shots"&&<Btn t={t} small onClick={addShot}>+ Add Shot</Btn>}
              {tab==="resources"&&<Btn t={t} small onClick={()=>updResources([...resources,makeResource()])}>+ Add Resource</Btn>}
            </div>
          </div>
        </div>
      </div>

      <div style={{maxWidth:940,margin:"0 auto",padding:"22px 40px 80px"}}>
        {tab==="shots"&&<>
          {filtered.length===0&&<div style={{color:t.text4,fontSize:15,fontStyle:"italic",padding:"24px 0"}}>No shots here.</div>}
          {filtered.map((shot,idx)=>{
            const isOpen = expanded===shot.id;
            const sm = smeta[shot.status];
            const firstImg = (shot.images||[])[0];
            const thumb = firstImg?(firstImg.data||firstImg.url):null;
            const imgCount = (shot.images||[]).length;
            const subCount = (shot.subScenes||[]).length;
            return (
              <div key={shot.id}
                draggable
                onDragStart={e=>onDragStart(e,shot.id)}
                onDragEnd={onDragEnd}
                onDragOver={e=>{e.preventDefault();setDragOver(shot.id);}}
                onDrop={()=>onDrop(shot.id)}
                style={{marginBottom:10,border:`1px solid ${dragOver===shot.id?t.accent:isOpen?t.accent:t.border}`,borderRadius:6,background:t.card,opacity:dragging===shot.id?0.4:1,boxShadow:t.shadow,transition:"border-color 0.15s"}}>
                <div style={{display:"flex",alignItems:"center",padding:"14px 18px",gap:14}}>
                  <div className="drag-handle" onMouseDown={onHandleMouseDown} onMouseUp={()=>{isDraggingRef.current=false;}}
                    style={{color:t.text4,fontSize:20,flexShrink:0,userSelect:"none",padding:"2px 6px",borderRadius:3,border:`1px solid ${t.border2}`}} title="Drag to reorder">⠿</div>
                  <div style={{minWidth:36,height:36,border:`1px solid ${t.border}`,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,color:t.gold,fontFamily:"monospace",flexShrink:0,fontWeight:"bold"}}>{idx+1}</div>
                  {thumb&&<img src={thumb} style={{width:56,height:36,objectFit:"cover",borderRadius:3,flexShrink:0,border:`1px solid ${t.border}`}} onError={e=>e.target.style.display="none"}/>}
                  <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>setExpanded(isOpen?null:shot.id)}>
                    <div style={{fontSize:15,letterSpacing:"0.06em",color:t.text,textTransform:"uppercase"}}>{shot.title}</div>
                    <div style={{display:"flex",gap:8,alignItems:"center",marginTop:3,flexWrap:"wrap"}}>
                      {!isOpen&&<div style={{fontSize:13,color:t.text4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{shot.description||"—"}</div>}
                      {imgCount>0&&<span style={{fontSize:11,color:t.text4,flexShrink:0,background:t.bg3,padding:"2px 8px",borderRadius:10,border:`1px solid ${t.border}`}}>{imgCount} img{imgCount>1?"s":""}</span>}
                      {subCount>0&&<span style={{fontSize:11,color:t.gold,flexShrink:0,background:t.bg3,padding:"2px 8px",borderRadius:10,border:`1px solid ${t.border}`}}>{subCount} sub-scene{subCount>1?"s":""}</span>}
                    </div>
                  </div>
                  <select value={shot.status} onChange={e=>{e.stopPropagation();upd(shot.id,"status",e.target.value);}} onClick={e=>e.stopPropagation()}
                    style={{background:t.bg3,border:`2px solid ${sm.border}`,color:sm.color,padding:"6px 12px",fontSize:13,letterSpacing:"0.06em",textTransform:"uppercase",borderRadius:4,cursor:"pointer",flexShrink:0,fontWeight:"bold"}}>
                    {STATUS_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
                  </select>
                  <button onClick={e=>{e.stopPropagation();setConfirmDelete(shot.id);}} style={{background:"none",border:`1px solid ${t.border}`,borderRadius:4,color:t.text4,cursor:"pointer",fontSize:18,padding:"4px 10px",flexShrink:0}}>×</button>
                  <div onClick={()=>setExpanded(isOpen?null:shot.id)} style={{color:t.text4,fontSize:11,flexShrink:0,transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.2s",cursor:"pointer"}}>▼</div>
                </div>
                {isOpen&&(
                  <div style={{padding:"0 18px 22px",borderTop:`1px solid ${t.border2}`}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginTop:18}}>
                      <Field label="Shot Title" t={t}><input value={shot.title} onChange={e=>upd(shot.id,"title",e.target.value)} style={{...inp(t),textTransform:"uppercase",letterSpacing:"0.06em"}}/></Field>
                      <Field label="Status" t={t}>
                        <select value={shot.status} onChange={e=>upd(shot.id,"status",e.target.value)} style={{...inp(t),color:smeta[shot.status].color,border:`2px solid ${smeta[shot.status].border}`,fontWeight:"bold"}}>
                          {STATUS_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
                        </select>
                      </Field>
                    </div>
                    <Field label="Reference Images (up to 4)" t={t} mt={18}><ImagesField images={shot.images||[]} onChange={v=>upd(shot.id,"images",v)} t={t}/></Field>
                    <Field label="Scene Description" t={t} mt={18}><Textarea value={shot.description} onChange={v=>upd(shot.id,"description",v)} placeholder="What happens visually in this shot…" t={t}/></Field>
                    <Field label="Narration / VO" t={t} mt={14}><Textarea value={shot.narration} onChange={v=>upd(shot.id,"narration",v)} placeholder="Voice-over or silence notes…" t={t}/></Field>
                    <Field label="Image Prompts" t={t} mt={14}><Textarea value={shot.prompts} onChange={v=>upd(shot.id,"prompts",v)} placeholder="Paste generation prompts here — one per frame…" mono t={t}/></Field>
                    <Field label="Notes & Thoughts" t={t} mt={14}><Textarea value={shot.notes} onChange={v=>upd(shot.id,"notes",v)} placeholder="Framing ideas, references, problems to solve…" t={t}/></Field>
                    <SubScenePanel shot={shot} subScenes={shot.subScenes||[]} onUpdate={ss=>upd(shot.id,"subScenes",ss)} t={t}/>
                  </div>
                )}
              </div>
            );
          })}
          <div style={{marginTop:20}}><Btn t={t} onClick={addShot}>+ Add Shot</Btn></div>
        </>}

        {tab==="resources"&&<>
          <div style={{fontSize:15,color:t.text3,marginBottom:24,lineHeight:1.8}}>Project-specific references — character sheets, Blender source files, mood boards, Drive folders for this video only.</div>
          {resources.length===0&&<div style={{color:t.text4,fontSize:15,fontStyle:"italic",marginBottom:20}}>No resources yet.</div>}
          {resources.map(r=>(
            <div key={r.id} style={{marginBottom:10,border:`1px solid ${t.border}`,borderRadius:6,background:t.card,padding:"18px 20px",boxShadow:t.shadow}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                <Field label="Label" t={t}><input value={r.label} onChange={e=>updResources(resources.map(x=>x.id===r.id?{...x,label:e.target.value}:x))} placeholder="e.g. Character Reference Sheet" style={inp(t)}/></Field>
                <Field label="URL" t={t}><input value={r.url} onChange={e=>updResources(resources.map(x=>x.id===r.id?{...x,url:e.target.value}:x))} placeholder="https://drive.google.com/…" style={inp(t)}/></Field>
              </div>
              <Field label="Context" t={t}>
                <div style={{display:"flex",gap:10}}>
                  <input value={r.context} onChange={e=>updResources(resources.map(x=>x.id===r.id?{...x,context:e.target.value}:x))} placeholder="What is this file? How is it used?" style={{...inp(t),flex:1}}/>
                  {r.url&&<a href={r.url} target="_blank" rel="noreferrer" style={{padding:"10px 18px",background:t.accent,borderRadius:4,color:"#fff",fontSize:14,whiteSpace:"nowrap"}}>Open →</a>}
                  <button onClick={()=>updResources(resources.filter(x=>x.id!==r.id))} style={{background:"none",border:`1px solid ${t.border}`,borderRadius:4,color:t.text3,cursor:"pointer",fontSize:18,padding:"6px 14px"}}>×</button>
                </div>
              </Field>
            </div>
          ))}
          <div style={{marginTop:20}}><Btn t={t} onClick={()=>updResources([...resources,makeResource()])}>+ Add Resource</Btn></div>
        </>}
      </div>
      {confirmDelete&&<Modal title="Delete shot?" body={`"${shots.find(s=>s.id===confirmDelete)?.title}" will be permanently removed.`} onConfirm={()=>deleteShot(confirmDelete)} onCancel={()=>setConfirmDelete(null)} danger t={t}/>}
    </div>
  );
}

// ── Shared ────────────────────────────────────────────────────────────────
const Loading=()=>(
  <div style={{minHeight:"100vh",background:"#0a0a0a",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{color:"#555",fontSize:14,letterSpacing:"0.2em",textTransform:"uppercase"}}>Connecting…</div>
  </div>
);
const SaveDot=({status,t})=>{
  const c=status==="saved"?"#2ecc71":status==="saving"?"#f39c12":"#e74c3c";
  return <div style={{fontSize:12,color:c,letterSpacing:"0.08em",textTransform:"uppercase",marginTop:2}}>{status==="saved"?"● Saved":status==="saving"?"● Saving…":"● Error"}</div>;
};
const Field=({label,children,t,mt=0})=>(
  <div style={{marginTop:mt}}>
    <div style={{fontSize:11,letterSpacing:"0.2em",color:t.accent,textTransform:"uppercase",marginBottom:8}}>{label}</div>
    {children}
  </div>
);
const Textarea=({value,onChange,placeholder,mono,t})=>(
  <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={3}
    style={{width:"100%",background:t.inputBg,border:`1px solid ${t.border}`,borderRadius:4,color:t.inputText,fontSize:15,padding:"10px 13px",fontFamily:mono?"monospace":"Georgia,serif",lineHeight:1.8,boxSizing:"border-box",outline:"none"}}/>
);
const Btn=({children,onClick,disabled,small,muted,danger,t})=>(
  <button onClick={onClick} disabled={disabled} style={{padding:small?"7px 16px":"10px 22px",background:danger?(t.bg==="#0a0a0a"?"#3d0000":"#fdecea"):muted?"transparent":t.accent,border:`1px solid ${danger?"#c0392b":muted?t.border:t.accent}`,borderRadius:4,color:danger?"#e74c3c":muted?t.text3:"#ffffff",fontSize:small?13:15,letterSpacing:"0.05em",cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.4:1,whiteSpace:"nowrap"}}>{children}</button>
);
const Modal=({title,body,onConfirm,onCancel,danger,t})=>(
  <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999}}>
    <div style={{background:t.card,border:`1px solid ${t.border}`,borderRadius:8,padding:32,maxWidth:400,width:"90%",boxShadow:t.shadow}}>
      <div style={{fontSize:18,color:t.text,marginBottom:12}}>{title}</div>
      <div style={{fontSize:14,color:t.text3,lineHeight:1.7,marginBottom:28}}>{body}</div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn muted onClick={onCancel} t={t}>Cancel</Btn>
        <Btn danger={danger} onClick={onConfirm} t={t}>Delete</Btn>
      </div>
    </div>
  </div>
);
const inp=t=>({width:"100%",background:t.inputBg,border:`1px solid ${t.border}`,borderRadius:4,color:t.inputText,fontSize:15,padding:"10px 13px",fontFamily:"Georgia,serif",outline:"none",boxSizing:"border-box"});

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
